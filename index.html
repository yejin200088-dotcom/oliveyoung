<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio - 박예진</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
  <img src="image/mainpage.jpg" id="staticImg" alt="">
  <canvas id="canvas"></canvas>

  <!-- ABOUT -->
  <section class="carousel" id="aboutCarousel" style="display:none;">
    <ol class="carousel__viewport">
      <li class="carousel__slide" style="background-image:url('image/aboutme1.jpg')"></li>
      <li class="carousel__slide" style="background-image:url('image/aboutme2.jpg')"></li>
      <li class="carousel__slide" style="background-image:url('image/aboutme3.jpg')"></li>
      <li class="carousel__slide" style="background-image:url('image/aboutme4.jpg')"></li>
      <li class="carousel__slide" style="background-image:url('image/aboutme5.jpg')"></li>
      <li class="carousel__slide" style="background-image:url('image/aboutme6.jpg')"></li>
      <li class="carousel__slide" style="background-image:url('image/aboutme7.jpg')"></li>
    </ol>
    <button class="carousel__btn prev"></button>
    <button class="carousel__btn next"></button>
  </section>

  <!-- PORTFOLIO -->
  <section class="carousel" id="portfolioCarousel" style="display:none;">
    <ol class="carousel__viewport">

      <li class="carousel__slide" style="background-image:url('image/portfolio1.jpg')">
        <div class="portfolio-buttons">
          <a class="detail-button" data-popup="image/landing1.png">
            <img src="image/button.png">
          </a>
          <a class="detail-button" data-popup="image/landing11.png">
            <img src="image/button2.png">
          </a>
        </div>
      </li>

      <li class="carousel__slide" style="background-image:url('image/portfolio2.jpg')">
        <div class="portfolio-buttons">
          <a class="detail-button" data-popup="image/landing2.jpg">
            <img src="image/button.png">
          </a>
        </div>
      </li>

      <li class="carousel__slide" style="background-image:url('image/portfolio3.jpg')">
        <div class="portfolio-buttons">
          <a class="detail-button" data-popup="image/landing3.jpg">
            <img src="image/button.png">
          </a>
        </div>
      </li>

      <li class="carousel__slide" style="background-image:url('image/portfolio4.jpg')">
        <div class="portfolio-buttons">
          <a class="detail-button" data-popup="image/landing4.png">
            <img src="image/button.png">
          </a>
        </div>
      </li>

      <li class="carousel__slide" style="background-image:url('image/portfolio5.jpg')">
        <div class="portfolio-buttons">
          <a class="detail-button" data-popup="image/landing5.png">
            <img src="image/button.png">
          </a>
        </div>
      </li>

      <li class="carousel__slide" style="background-image:url('image/portfolio6.jpg')">
        <div class="portfolio-buttons">
          <a class="detail-button" data-popup="image/landing6.jpg">
            <img src="image/button.png">
          </a>
        </div>
      </li>

      <li class="carousel__slide" style="background-image:url('image/portfolio7.jpg')">
        <div class="portfolio-buttons">
          <a class="detail-button" data-popup="image/landing7.jpg">
            <img src="image/button.png">
          </a>
        </div>
      </li>

      <li class="carousel__slide" style="background-image:url('image/portfolio8.jpg')">
        <div class="portfolio-buttons">
          <a class="detail-button" data-popup="image/landing8.jpg">
            <img src="image/button.png">
          </a>
        </div>
      </li>

    </ol>
    <button class="carousel__btn prev"></button>
    <button class="carousel__btn next"></button>
  </section>
</div>

<!-- POPUP -->
<div class="popup-dim" id="popupDim"></div>
<button class="popup-close" id="popupClose">✕</button>
<div class="popup" id="popup">
  <img id="popupImg">
</div>

<!-- NAV -->
<nav id="nav">
  <ul>
    <li><a href="#" id="goPortfolio">PORTFOLIO</a></li>
    <li><a href="#" id="goAbout">ABOUT ME</a></li>
  </ul>
  <button class="icon" id="toggle">
    <img src="image/hamburgerin.png" id="toggleImg">
  </button>
</nav>

<script type="module" src="script.js"></script>
</body>
</html>
