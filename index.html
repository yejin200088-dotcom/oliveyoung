<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Liquid Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
  <!-- 배경 이미지 -->
  <img id="staticImg" src="image/mainpage.jpg" alt="" />

  <!-- liquid canvas -->
  <canvas id="canvas"></canvas>

  <!-- 네비게이션 -->
  <nav id="nav">
    <button id="toggle" class="icon">
      <img id="toggleImg" src="image/hamburgerin.png" />
    </button>
    <ul>
      <li><a href="#" id="goAbout">ABOUT</a></li>
      <li><a href="#" id="goPortfolio">PORTFOLIO</a></li>
    </ul>
  </nav>

  <!-- ABOUT 캐러셀 -->
  <section class="carousel" id="aboutCarousel" style="display:block">
    <button class="carousel__btn prev"></button>
    <ul class="carousel__viewport">
      <li class="carousel__slide" style="background-image:url('image/aboutme1.jpg')"></li>
      <li class="carousel__slide" style="background-image:url('image/aboutme2.jpg')"></li>
      <li class="carousel__slide" style="background-image:url('image/aboutme3.jpg')"></li>
    </ul>
    <button class="carousel__btn next"></button>
  </section>

  <!-- PORTFOLIO 캐러셀 -->
  <section class="carousel" id="portfolioCarousel" style="display:none">
    <button class="carousel__btn prev"></button>
    <ul class="carousel__viewport">
      <li class="carousel__slide" style="background-image:url('image/portfolio1.jpg')"></li>
      <li class="carousel__slide" style="background-image:url('image/portfolio2.jpg')"></li>
    </ul>
    <button class="carousel__btn next"></button>
  </section>

  <!-- 상세보기 버튼 예시 -->
  <a class="detail-button" data-popup="image/landing.jpg">
    <img src="image/detail.png" />
  </a>
</div>

<!-- 팝업 -->
<div id="popupDim" class="popup-dim"></div>
<div id="popup" class="popup">
  <img id="popupImg" />
</div>
<button id="popupClose" class="popup-close">×</button>

<script type="module" src="script.js"></script>
</body>
</html>
