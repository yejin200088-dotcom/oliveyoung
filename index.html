<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - 박예진</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
    <img src="image/mainpage.jpg" alt="background" class="base-image" id="staticImg">
    <canvas id="canvas"></canvas>

    <!-- ABOUT CAROUSEL -->
    <section class="carousel" id="aboutCarousel" style="display: none;">
        <ol class="carousel__viewport">
            <li class="carousel__slide" style="background-image: url('image/aboutme1.jpg');"></li>
            <li class="carousel__slide" style="background-image: url('image/aboutme2.jpg');"></li>
            <li class="carousel__slide" style="background-image: url('image/aboutme3.jpg');"></li>
            <li class="carousel__slide" style="background-image: url('image/aboutme4.jpg');"></li>
            <li class="carousel__slide" style="background-image: url('image/aboutme5.jpg');"></li>
            <li class="carousel__slide" style="background-image: url('image/aboutme6.jpg');"></li>
            <li class="carousel__slide" style="background-image: url('image/aboutme7.jpg');"></li>
        </ol>
        <button class="carousel__btn prev"></button>
        <button class="carousel__btn next"></button>
    </section>

    <!-- PORTFOLIO CAROUSEL -->
    <section class="carousel" id="portfolioCarousel" style="display: none;">
        <ol class="carousel__viewport">

            <!-- Slide 1 -->
            <li class="carousel__slide slide-1" style="background-image: url('image/portfolio1.jpg');">
                <a href="javascript:void(0)" class="detail-button button-3" data-popup="image/landing1.png">
                    <img src="image/button3.png">
                </a>
                <a href="javascript:void(0)" class="detail-button button-4" data-popup="image/landing11.png">
                    <img src="image/button4.png">
                </a>
            </li>

            <!-- Slide 2 -->
            <li class="carousel__slide slide-2" style="background-image: url('image/portfolio2.jpg');">
                <a href="javascript:void(0)" class="detail-button" data-popup="image/landing2.jpg">
                    <img src="image/button.png">
                </a>
            </li>

            <!-- Slide 3 -->
            <li class="carousel__slide slide-3" style="background-image: url('image/portfolio3.jpg');">
                <a href="javascript:void(0)" class="detail-button" data-popup="image/landing3.jpg">
                    <img src="image/button.png">
                </a>
            </li>

            <!-- Slide 4 -->
            <li class="carousel__slide slide-4" style="background-image: url('image/portfolio4.jpg');">
                <a href="javascript:void(0)" class="detail-button" data-popup="image/landing4.png">
                    <img src="image/button.png">
                </a>
            </li>

            <!-- Slide 5 -->
            <li class="carousel__slide slide-5" style="background-image: url('image/portfolio5.jpg');">
                <a href="javascript:void(0)" class="detail-button" data-popup="image/landing5.png">
                    <img src="image/button.png">
                </a>
                <a href="https://www.figma.com/proto/VRbC4LwdC9dDfCZBqJNJDn/Untitled?page-id=0%3A1&node-id=178-826&viewport=-2040%2C1160%2C0.46&t=MXsaWoIRVkxsm6Y3-1&scaling=scale-down&content-scaling=fixed&starting-point-node-id=178%3A826&show-proto-sidebar=1" 
                   class="custom-area-link-2" target="_blank"></a>
            </li>

            <!-- Slide 6 -->
            <li class="carousel__slide slide-6" style="background-image: url('image/portfolio6.jpg');">
                <a href="javascript:void(0)" class="detail-button" data-popup="image/landing6.jpg">
                    <img src="image/button.png">
                </a>
            </li>

            <!-- Slide 7 -->
            <li class="carousel__slide slide-7" style="background-image: url('image/portfolio7.jpg');">
                <a href="javascript:void(0)" class="detail-button" data-popup="image/landing7.jpg">
                    <img src="image/button.png">
                </a>
                <a href="https://yejin200088-dotcom.github.io/website/" class="custom-area-link-1" target="_blank"></a>
            </li>

        </ol>
        <button class="carousel__btn prev"></button>
        <button class="carousel__btn next"></button>
    </section>
</div>

<!-- POPUP -->
<div class="popup-dim" id="popupDim"></div>
<button class="popup-close" id="popupClose">✕</button>
<div class="popup" id="popup">
    <div class="popup-content">
        <img id="popupImg" src="" alt="landing content">
    </div>
</div>

<!-- NAV -->
<nav id="nav"> 
    <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="#portfolio" id="goPortfolio">PORTFOLIO</a></li>
        <li><a href="#about" id="goAbout">ABOUT ME</a></li>
    </ul>
    <button class="icon" id="toggle"> 
        <img src="image/hamburgerin.png" id="toggleImg" alt="menu">
    </button>
</nav>

<script type="module" src="script.js"></script>
